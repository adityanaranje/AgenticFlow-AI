# ============================================================
# AgentFlow AI - development infrastructure
#
# This compose file runs ONLY the components that are meaningful
# to run locally in development:
#   - backend   (FastAPI application)
#   - frontend  (Next.js application)
#   - document-worker (consumes the document ingestion queue)
#   - research-worker (consumes the research run queue)
#   - redis     (cache / queue - the only local data service)
#
# Supabase, Qdrant and Langfuse are external managed services in
# this architecture. Do not run duplicate local copies of them;
# point the containers at your hosted instances through the
# environment variables below (copy `.env.example` to `.env`).
#
#   docker compose up --build
# ============================================================

# Shared environment for every Python service (API + both workers).
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  # OpenAI
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

  # Supabase
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

  # Qdrant
  QDRANT_URL: ${QDRANT_URL:-}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-agentflow_documents}

  # Redis (container-local)
  REDIS_URL: redis://redis:6379/0
  REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-3600}

  # Langfuse
  LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentflow-backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  document-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentflow-document-worker
    # Without a consumer, uploaded documents stay `pending` forever.
    command: ["python", "-m", "app.workers.document_worker"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  research-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentflow-research-worker
    command: ["python", "-m", "app.workers.research_worker"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the browser bundle at build time (see frontend/Dockerfile).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: agentflow-frontend
    environment:
      # Inlined into the browser bundle at build time by Next.js.
      # Only public/anonymous credentials and the API URL belong here.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentflow-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
