[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-ai"
version = "0.1.0"
description = "Production-oriented multi-agent AI research and knowledge intelligence platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",

    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",

    "openai>=1.50,<3.0",

    "supabase>=2.9,<3.0",

    "qdrant-client>=1.12,<2.0",

    "redis>=5.0,<7.0",

    "langfuse>=2.50,<4.0",

    "python-dotenv>=1.0,<2.0",

    "httpx>=0.27,<1.0",

    "tenacity>=9.0,<10.0",

    "orjson>=3.10,<4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0"
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false

