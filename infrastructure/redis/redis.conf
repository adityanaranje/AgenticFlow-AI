# ============================================================
# AgentFlow AI - development Redis configuration
#
# Development-only settings. The container also exposes the data
# volume `redis-data` so cached state survives restarts.
# ============================================================

bind 0.0.0.0
port 6379

# Keep data on disk through the named volume (AOF + RDB snapshots).
appendonly yes
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000

# Reasonable limits for development.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging.
loglevel notice
logfile ""
